environment: dev

project:
  name: airline-operations-revenue-platform

data_generation:
  flight_count: 50000
  booking_count: 100000
  ticket_count: 100000
  seed: 42
  output_format: csv
  start_date: "2026-01-01"
  end_date: "2026-03-31"

storage:
  raw_path: data/raw
  processed_path: data/processed
  sample_path: data/sample
  airports_reference_path: data/sample/airports_reference.csv

spark:
  app_name: AirlineOperationsPlatform
  master: local[*]
  log_level: WARN
  shuffle_partitions: 8